# ddpm.com.my: static company website
# Install: sudo cp deploy/ddpm.conf /etc/nginx/sites-available/ddpm
#          sudo ln -s /etc/nginx/sites-available/ddpm /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d ddpm.com.my -d www.ddpm.com.my --redirect
server {
    listen 80;
    listen [::]:80;
    server_name ddpm.com.my www.ddpm.com.my;

    root /srv/ddpm/site/site;
    index index.html;
    error_page 404 /404.html;

    access_log /var/log/nginx/ddpm.access.log;
    error_log  /var/log/nginx/ddpm.error.log;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    # Security headers: the site loads nothing from other servers
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /favicon.svg { expires 7d; try_files $uri =404; }

    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ =404;
    }

    # Never serve Git data or deployment files
    location ~ /\.(?!well-known) { deny all; }
}
